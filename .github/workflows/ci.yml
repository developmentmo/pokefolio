name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start PostgreSQL via Testcontainers (Docker is available on ubuntu-latest).
      - name: Verify
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  app:
    name: Flutter app (format, analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format --line-length 120 lib > /dev/null
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed --line-length 120 lib test
      - run: flutter analyze
      - run: flutter test
      - name: Web build
        run: flutter build web --release --no-web-resources-cdn

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, app]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pokefolio-backend:ci backend
      - name: Build web image
        run: docker build -t pokefolio-web:ci app
